openapi: 3.1.0
info:
  title: Kubeflow Pipelines REST API
  description: >-
    REST API for the Kubeflow Pipelines platform (v2beta1). Provides programmatic
    access to manage experiments, pipelines, pipeline versions, runs, and
    recurring jobs on a Kubeflow Pipelines deployment. Authentication is handled
    by the Kubeflow distribution and is typically a bearer token or session
    cookie passed in request headers.
  version: 2beta1
  contact:
    name: Kubeflow Pipelines
    url: https://www.kubeflow.org/docs/components/pipelines/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://{host}/pipeline
    description: Kubeflow Pipelines deployment (replace {host} with your cluster hostname)
    variables:
      host:
        default: kubeflow.example.com
        description: Hostname of the Kubeflow deployment
security:
  - bearerAuth: []
tags:
  - name: Experiments
    description: Group runs and recurring jobs into experiments
  - name: Pipelines
    description: Manage pipeline definitions
  - name: PipelineVersions
    description: Manage versions of pipelines
  - name: Runs
    description: Pipeline runs
  - name: Health
    description: Health and auth checks
paths:
  /apis/v2beta1/healthz:
    get:
      tags:
        - Health
      operationId: getHealthz
      summary: API server health check
      responses:
        '200':
          description: Service healthy
  /apis/v2beta1/experiments:
    get:
      tags:
        - Experiments
      operationId: listExperiments
      summary: List experiments
      parameters:
        - in: query
          name: namespace
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: page_token
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
      responses:
        '200':
          description: List of experiments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExperimentsResponse'
    post:
      tags:
        - Experiments
      operationId: createExperiment
      summary: Create a new experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Experiment'
      responses:
        '200':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
  /apis/v2beta1/experiments/{experiment_id}:
    get:
      tags:
        - Experiments
      operationId: getExperiment
      summary: Get experiment by ID
      parameters:
        - in: path
          name: experiment_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experiment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
    delete:
      tags:
        - Experiments
      operationId: deleteExperiment
      summary: Delete experiment
      parameters:
        - in: path
          name: experiment_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /apis/v2beta1/pipelines:
    get:
      tags:
        - Pipelines
      operationId: listPipelines
      summary: List pipelines
      parameters:
        - in: query
          name: namespace
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: page_token
          schema:
            type: string
      responses:
        '200':
          description: List of pipelines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPipelinesResponse'
    post:
      tags:
        - Pipelines
      operationId: createPipeline
      summary: Create a pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
      responses:
        '200':
          description: Pipeline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
  /apis/v2beta1/pipelines/{pipeline_id}:
    get:
      tags:
        - Pipelines
      operationId: getPipeline
      summary: Get pipeline by ID
      parameters:
        - in: path
          name: pipeline_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
    delete:
      tags:
        - Pipelines
      operationId: deletePipeline
      summary: Delete pipeline
      parameters:
        - in: path
          name: pipeline_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /apis/v2beta1/pipelines/{pipeline_id}/versions:
    get:
      tags:
        - PipelineVersions
      operationId: listPipelineVersions
      summary: List versions of a pipeline
      parameters:
        - in: path
          name: pipeline_id
          required: true
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: page_token
          schema:
            type: string
      responses:
        '200':
          description: List of pipeline versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPipelineVersionsResponse'
    post:
      tags:
        - PipelineVersions
      operationId: createPipelineVersion
      summary: Create a pipeline version
      parameters:
        - in: path
          name: pipeline_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineVersion'
      responses:
        '200':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineVersion'
  /apis/v2beta1/pipelines/upload:
    post:
      tags:
        - Pipelines
      operationId: uploadPipeline
      summary: Upload a pipeline package
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: description
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                uploadfile:
                  type: string
                  format: binary
              required:
                - uploadfile
      responses:
        '200':
          description: Pipeline uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
  /apis/v2beta1/runs:
    get:
      tags:
        - Runs
      operationId: listRuns
      summary: List pipeline runs
      parameters:
        - in: query
          name: namespace
          schema:
            type: string
        - in: query
          name: experiment_id
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
        - in: query
          name: page_token
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: filter
          schema:
            type: string
      responses:
        '200':
          description: List of runs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Bearer token issued by your Kubeflow distribution's identity provider.
        Some deployments use a session cookie instead.
  schemas:
    Experiment:
      type: object
      properties:
        experiment_id:
          type: string
          readOnly: true
        display_name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        namespace:
          type: string
        storage_state:
          type: string
          enum:
            - AVAILABLE
            - ARCHIVED
    ListExperimentsResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        total_size:
          type: integer
        next_page_token:
          type: string
    Pipeline:
      type: object
      properties:
        pipeline_id:
          type: string
          readOnly: true
        display_name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        namespace:
          type: string
    ListPipelinesResponse:
      type: object
      properties:
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/Pipeline'
        total_size:
          type: integer
        next_page_token:
          type: string
    PipelineVersion:
      type: object
      properties:
        pipeline_id:
          type: string
        pipeline_version_id:
          type: string
          readOnly: true
        display_name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    ListPipelineVersionsResponse:
      type: object
      properties:
        pipeline_versions:
          type: array
          items:
            $ref: '#/components/schemas/PipelineVersion'
        total_size:
          type: integer
        next_page_token:
          type: string
